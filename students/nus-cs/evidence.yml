research:
  - id: research-open-vocabulary-perception
    title: "Open-Vocabulary Object Detection for Indoor Service Robots"
    role: "undergraduate research assistant"
    dates: "2025-2027"
    status: "in_progress"
    methods:
      - "open-vocabulary object detection"
      - "vision-language models"
      - "robotics perception"
      - "Python"
      - "PyTorch"
    summary: "Evaluates how open-vocabulary detectors transfer from web-scale image data to robot-collected indoor scenes, with emphasis on failure cases under clutter and occlusion."
  - id: research-domain-shift-driving-scenes
    title: "Domain Shift Analysis for Night-Time Driving Scene Segmentation"
    role: "summer research intern"
    dates: "2026"
    status: "completed"
    methods:
      - "semantic segmentation"
      - "domain shift evaluation"
      - "calibration analysis"
      - "benchmark datasets"
    summary: "Measured segmentation degradation between daytime and night-time street scenes and summarized error patterns for small objects, glare, and low-light boundaries."
  - id: research-capstone-visual-retrieval
    title: "Capstone: Efficient Visual Retrieval for Museum Collections"
    role: "capstone project lead"
    dates: "2026-2027"
    status: "in_progress"
    methods:
      - "contrastive image-text retrieval"
      - "approximate nearest neighbor search"
      - "evaluation metrics"
      - "technical writing"
    summary: "Builds a retrieval prototype for matching exhibit photos to catalog metadata while tracking precision, recall, and curator-reviewed failure modes."

projects:
  - id: project-robot-vision-benchmark
    title: "Robot Vision Benchmark Toolkit"
    dates: "2026"
    summary: "Built a reproducible evaluation toolkit for object detection models on indoor robot camera frames, including dataset splits, mAP reports, and qualitative error galleries."
    tools:
      - "Python"
      - "PyTorch"
      - "OpenCV"
      - "Weights and Biases"
  - id: project-depth-completion
    title: "Monocular Depth Completion for Cluttered Indoor Scenes"
    dates: "2025"
    summary: "Implemented a depth-completion model and ablation study for sparse depth inputs, reporting RMSE and boundary error on a small classroom benchmark."
    tools:
      - "Python"
      - "PyTorch"
      - "NumPy"
      - "OpenCV"
  - id: project-rubric-eval-dashboard
    title: "Visual Model Error Review Dashboard"
    dates: "2026"
    summary: "Created a local dashboard for annotating computer vision model failures, comparing reviewer rubrics, and exporting disagreement summaries for research meetings."
    tools:
      - "React"
      - "SQLite"
      - "Python"

