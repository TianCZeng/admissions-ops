  statement_type: statement_of_purpose
  prompt_source_url: https://www.cs.cmu.edu/education/graduate-admissions
  prompt_text: "The application asks for a concise one- or two-page essay describing research interests, related experiences, and objectives for graduate study at Carnegie Mellon."
  page_limit: 2
  strategy_summary: "Build the statement around one truthful thesis: the student's recent work repeatedly exposes the same failure mode, namely vision systems breaking under distribution shift, and Carnegie Mellon's Master of Science in Computer Vision is the right place to deepen the technical base behind robust perception. Keep the narrative grounded in concrete projects, connect computer vision coursework to research practice, and show why CMU's Robotics Institute is the next step without overselling unfinished work."
  core_argument: "This applicant is not asking for a generic master's degree; the application is a targeted request for deeper training in computer vision because current coursework and research have already surfaced the next technical questions. MSCV is a good fit because the student's evidence is strongest where open-vocabulary detection, domain shift, evaluation, and robotics perception overlap with real deployment problems."
