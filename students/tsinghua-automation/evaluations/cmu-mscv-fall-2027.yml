questions:
  - Does MSCV apply any minimum TOEFL total or component score, and would a total of 104 with a Speaking sub-score of 23 be reviewed without prejudice?
  - What form of English documentation does MSCV accept for a Chinese-language undergraduate transcript and degree certificate, and is a university-issued English transcript sufficient?
  - Does the Fall 2027 application add a program-specific statement prompt beyond the general one- to two-page guidance?
  - Does MSCV state a preferred resume page length, and does the committee want publications listed on the resume itself?
  - Given that MSCV is described as a professional degree that should not be viewed as PhD preparation, how does the committee read applicants whose recent work is research-flavoured but whose stated aim is industry perception work?
  - Is the required three-unit summer internship arranged by the student, and does the program place any restriction on internships taken outside the United States?
cv_adaptation_plan:
  document_type: admissions_resume
  summary: >-
    Render a concise admissions resume rather than an academic CV, because both the MSCV application page and the SCS instructions ask for a resume and the program is an industry-facing professional degree that states publications are not required. Order the document so the visual-localization thread reads first, since the MSCV core treats geometry and SLAM as one of its two areas: the in-progress loop-closure research, then the defended graduation project, then the uncertainty-calibration work, then the three hands-on projects that show measurement and calibration discipline. Follow with the coursework that maps onto the program's own recommended skill set, then the two university awards. Coursework selection is deliberate rather than exhaustive: each course answers something the recommended skill set names.
  profile_summary: "Computer vision applicant working on visual SLAM loop-closure robustness, with a defended visual-localization graduation project, an indoor SLAM evaluation harness, and camera-IMU calibration work on laboratory robots."
  evidence_priorities:
    - edu-tsinghua-beng-automation
    - research-loop-closure-robustness
    - research-graduation-project
    - research-depth-calibration
    - project-slam-evaluation-harness
    - project-camera-imu-calibration
    - project-warehouse-robot
    - course-computer-vision
    - course-machine-learning
    - course-pattern-recognition
    - course-robotics
    - course-linear-algebra
    - course-probability-statistics
    - course-data-structures
    - course-optimal-control
    - course-digital-signal-processing
    - award-outstanding-graduate
    - award-academic-excellence-scholarship
  unresolved_questions:
    - The admissions-resume document type cannot render publications, presentations, teaching, or service, so the workshop paper under review, the two delivered presentations, the Automatic Control Theory laboratory and Introduction to Robotics teaching roles, and the reading-group organizing role do not appear in the generated artifact. The SCS resume guidance names publications and honors as resume content, so decide whether to add them manually before submission.
    - Automatic Control Theory 90/100 is omitted from the coursework block as the least relevant of the upper-undergraduate courses; confirm that omission is acceptable given the applicant's automation background.
    - No resume page length is published. The rendered document is expected to run to roughly two pages; confirm that is acceptable or trim the coursework block.
