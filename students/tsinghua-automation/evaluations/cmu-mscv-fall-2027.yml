fit:
  summary: >-
    MSCV is close to the best available subject match for this applicant. The student's entire evidence base sits on visual localization, loop closure, multi-view geometry, and pose graph optimization, and the MSCV curriculum treats geometry and SLAM as one of the two areas its core is built to address, with a core option that pairs Geometry-based Methods in Vision with Robot Localization and Mapping. The mathematics the program recommends on entry is almost exactly the mathematics this transcript covers. Two dimensions pull the score down and neither is about subject fit. Goal alignment is genuinely partial: the student's brief frames graduate study as a step before deciding on a PhD, while CMU states that MSCV should not be viewed as a preparatory degree for a PhD and offers no thesis or guaranteed research. And the program offers no financial aid of any kind, which makes a fully self-funded 16 months the practical precondition for applying at all.
  dimensions:
    academic_preparation: Very strong and unusually well matched. Computer Vision 95/100, Machine Learning 94/100, Pattern Recognition 93/100, Introduction to Robotics 92/100, Linear Algebra 92/100, Probability Theory and Mathematical Statistics 91/100, Optimal Control Theory 88/100, and Digital Signal Processing 87/100 cover linear algebra, probability and statistics, optimization, Fourier analysis, and data structures, which is most of the MSCV recommended skill set. The toolchain in evidence (C++, Python, MATLAB, OpenCV, LaTeX) is the one that page names.
    research_or_subject_fit: The strongest dimension. Visual odometry, multi-view geometry, pose graph optimization, place recognition, and loop-closure failure analysis map directly onto the geometry half of the MSCV core, including the 16-822 and 16-833 core option and the program's own listing of SLAM under multi-view reconstruction.
    evidence_strength: Three research items, three hands-on projects, a workshop paper under review, two delivered presentations, two teaching roles, and two university awards. The MSCV committee explicitly asks for project experience beyond class work and this profile has it. Weakened only by the loop-closure work being in progress and the workshop paper being unpublished.
    goal_alignment: >-
      The weakest dimension and the one real finding of this evaluation. The student's stated long-term goal, localization that survives revisits across lighting, clutter, and season, fits a professional computer vision master's well. The framing around it does not: the brief treats a coursework-heavy master's as the step before committing to a PhD, and the MSCV FAQ states the program should not be viewed as a preparatory degree program for earning a PhD, is not research-based, and offers no master's thesis. Roughly 4 percent of alumni are in a PhD program. This is a positioning decision the applicant must make, not a defect in the record.
    admissions_feasibility: Moderate. The technical case is strong, but three things cut against it. The TOEFL total of 104 sits just below the 105-114 range SCS reports for admitted applicants, and the FAQ says successful international applicants consistently score high marks. The committee looks for evidence of working on an English-speaking team, particularly in an internship, and this profile has no internship or industry experience. GRE Verbal 158 is unremarkable in a competitive pool, though Quantitative 168 is strong.
    practical_constraints: >-
      The weakest practical picture in this evaluation. MSCV offers no financial aid or scholarship funding and expects accepted students to be fully self-supported; published tuition is $67,000 plus mandatory fees for 2026-27, with no 2027-28 figure yet. All three coursework semesters must be spent on the Pittsburgh campus, and a computer-vision-relevant summer internship is required for graduation. Timing is otherwise clean: the research-assistant year runs 2026-2027 and ends before a Fall 2027 start.
    application_effort: Moderate to high. The package is a resume, a 1-to-2-page statement, three electronic recommendations, transcripts uploaded before submission, and reporting of both GRE and TOEFL scores. The transcript is in Chinese, so English documentation has to be arranged outside this repository, and every English rendering of a Chinese course, degree, or award title has to be reconciled across documents.
competitiveness_gaps:
  - TOEFL iBT 104 is just below the 105-114 total range SCS reports for admitted applicants, and the MSCV FAQ states that successful international applicants consistently score high marks on the TOEFL. A retake before the recommended 2026-11-25 test date is the only mitigation available, and the Speaking 23 sub-score is the component most likely to be questioned.
  - The MSCV committee explicitly seeks evidence of working on an English-speaking team, particularly as part of an internship, and of creating well-written English documents. This profile has no internship or industry experience. The available mitigation is to foreground the English-language workshop paper under review, the reading-group organizing role, and the two delivered presentations, none of which the resume document type can render.
  - Goal alignment is a positioning risk rather than an evidence gap. The statement must not present MSCV as preparation for a PhD, because CMU states it should not be viewed that way; the applicant needs to decide what long-term framing to use instead.
  - The loop-closure research is in progress and the workshop paper is under review. Neither may be described as a finding or as published, which limits how much weight the strongest recent work can carry.
  - Funding is unaddressed in the student's preferences. A program with no aid and roughly $67,000 in annual tuition needs a self-funding plan before the application is worth submitting.
practical_constraints:
  - The Fall 2027 portal opens 2026-09-09. The early deadline is 2026-11-18 at 3 p.m. EST with an $80 fee per program; the final deadline is 2026-12-09 at 3 p.m. EST with a $100 fee per program.
  - SCS recommends taking or retaking the GRE or any English test no later than 2026-11-25 because reportable scores can take two weeks to process.
  - MSCV offers no financial aid or scholarship funding; accepted students are expected to be fully self-supported. Published tuition is $67,000 plus mandatory fees for 2026-27 and no 2027-28 figure exists yet.
  - The program is full-time only, with no distance learning, and requires presence on the Pittsburgh campus for all three coursework semesters. Three units of computer-vision-relevant summer internship are required for graduation.
  - The transcript and degree are issued in Chinese. Transcripts must be uploaded before submission, so English documentation has to be arranged well before the deadline; fall-semester grades are not required.
  - The student's research-assistant year is recorded as 2026-2027, which ends before a Fall 2027 start and creates no overlap conflict.
