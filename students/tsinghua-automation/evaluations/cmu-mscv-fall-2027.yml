    - Do not convert the Tsinghua percentage scale to a 4.0 GPA or restate 89.7/100 in another scale.
    - Do not describe the workshop paper as published or accepted; it is under review.
    - Do not describe the graduation project as continuing work; it was defended in June 2026.
    - Do not report any loop-closure result as a finding; that work is in progress.
    - Do not imply deployment experience on production robots; all work is on laboratory hardware and recorded sequences.
    - Do not name a faculty member or laboratory; no official MSCV page was used as a source for any individual name.
    - Do not claim a TOEFL or GRE minimum has been met, since none is published.
