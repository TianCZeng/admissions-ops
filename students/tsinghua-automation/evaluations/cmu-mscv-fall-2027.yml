statement_plan:
  statement_type: statement_of_purpose
  prompt_source_url: https://www.ri.cmu.edu/education/academic-programs/master-of-science-computer-vision/how-to-apply/
  prompt_text: 'The MSCV application materials list a "Statement of Purpose (1 to 2 pages)". The SCS graduate admissions instructions add that each program has specific requirements detailed on the application, and that generally applicants should "prepare a concise one- or two-page essay that describes your research interests, related experiences and objectives in pursuing a graduate degree at Carnegie Mellon", that the essay should be specific about why those interests are important and why the applicant is well-suited to pursue them, and that it should describe any relevant education, research, commercial, government or teaching experience.'
  word_limit: null
  page_limit: 2
  strategy_summary: "Build the statement on one truthful thesis the record already supports: two consecutive projects attacked the same localization failure from opposite ends, and the gaps they exposed are geometry, optimization, and the statistics of deciding whether two images are the same place, which is exactly what the core of the Robotics Institute's Master of Science in Computer Vision teaches. Lead with the localization thread as the student's brief directs for geometry-and-optimization programs, use the evaluation harness as the proof of experimental discipline, and cite the program's own curriculum language rather than generic praise. Keep the long-term goal in the applicant's own words from the brief and omit the PhD framing entirely, because CMU states MSCV should not be viewed as a preparatory degree for a PhD; that omission is recorded as an open decision rather than a silent edit. Report the percentage scale as published and keep the in-progress work and the paper under review in their actual status."
  core_argument: "This applicant does not need a general master's degree; the record shows a specific technical debt. The graduation project measured where visual localization drifts and the current research-assistant work is measuring when the loop-closure correction itself is wrong, and neither question can be closed without multi-view geometry beyond the undergraduate treatment, optimization on pose graphs, and a formal treatment of place-recognition decisions. MSCV is the right program because its core is built around geometry and SLAM alongside recognition, one core option pairs Geometry-based Methods in Vision with Robot Localization and Mapping, and the mathematics it recommends on entry is the mathematics this transcript already covers."
  paragraph_plan:
