sources:
  - url: https://www.ri.cmu.edu/education/academic-programs/master-of-science-computer-vision/
    retrieved_at: '2026-08-24'
    use: Program identity, duration, format, and computer vision learning outcomes
    notes: Official Robotics Institute program page. A 16-month full-time program in which the courses are the focus, complemented by a culminating hands-on team project. Learning outcomes include conducting experimental analysis consistent with current practice including standard metrics and benchmark datasets, and applying mathematical and machine learning tools such as geometry, optimization, and statistics to computer vision applications.
  - url: https://www.ri.cmu.edu/education/academic-programs/master-of-science-computer-vision/how-to-apply/
    retrieved_at: '2026-08-24'
    use: Admission requirements, application window, required documents, and score reporting codes
    notes: Official MSCV application page, page timestamp 2026-07-15. Requires an undergraduate degree in engineering, computer science, or applied mathematics; the General GRE (institution 2074, department 0402); TOEFL, IELTS, or Duolingo for applicants whose native language is not English (institution 4256, department 78); and a resume, a 1-to-2-page Statement of Purpose, transcripts, and three letters of recommendation. The portal is open September 9 to December 9, 2026 for a Fall 2027 start.
  - url: https://www.ri.cmu.edu/education/academic-programs/master-of-science-computer-vision/curriculum/
    retrieved_at: '2026-08-24'
    use: Curriculum structure, the geometry core option, and the required summer internship
    notes: Official MSCV curriculum page, page timestamp 2025-12-03. 111 units across three semesters and one summer. The core is designed to address the two main areas of current computer vision systems, recognition and geometry, the latter including multi-view reconstruction, Web-scale reconstruction, and SLAM. One core option pairs 16-822 Geometry-based Methods in Vision with 16-833 Robot Localization and Mapping. Three units of computer-vision-relevant summer internship are required for graduation.
  - url: https://www.ri.cmu.edu/education/academic-programs/master-of-science-computer-vision/recommended-skill-set/
    retrieved_at: '2026-08-24'
    use: Recommended incoming mathematics, programming, and software preparation
    notes: Official MSCV recommended skill set page, page timestamp 2018-03-06. Names linear algebra, probability and statistics, Fourier analysis, optimization including convex and sparse optimization and Levenberg-Marquardt, data structures, Matlab/C/C++/Python, OpenCV, and LaTeX.
  - url: https://www.ri.cmu.edu/education/academic-programs/master-of-science-computer-vision/faq/
    retrieved_at: '2026-08-24'
    use: Program character, admissions-committee expectations, funding policy, and PhD positioning
    notes: Official MSCV frequently asked questions. MSCV is a professional master's degree that should not be viewed as a preparatory degree program for earning a PhD; it is not research-based and offers no master's thesis. No financial aid or scholarship funding is offered and accepted students are expected to be fully self-supported. The committee expects undergraduate project experience beyond class work, states that it is challenging for applicants with only classwork experience to rise to the top, and seeks evidence of working on an English-speaking team and of well-written English documents. Successful international applicants consistently score high marks on the TOEFL.
  - url: https://www.ri.cmu.edu/education/academic-programs/master-of-science-computer-vision/tuition-information/
    retrieved_at: '2026-08-24'
    use: Published tuition and fee context for self-funding planning
    notes: Official MSCV tuition page, page timestamp 2026-01-26. Tuition for the 2026-27 academic year is $67,000 plus mandatory fees, and students are not assessed tuition for the summer internship. No 2027-28 figure is published yet.
  - url: https://www.cs.cmu.edu/education/graduate-admissions
    retrieved_at: '2026-08-24'
    use: Deadlines, fees, GRE and English-test policy and validity windows, transcripts, resume content, and statement guidance
    notes: Official SCS graduate admissions instructions. GRE scores may not be more than five years old. English tests are required for non-native speakers studying on F-1 or J-1 visas, with no waivers issued on any grounds including prior English-language study outside the United States; an applicant without a U.S. bachelor's degree needs a score no older than two years and scores taken before 2024-09-01 are not accepted. Most admitted applicants submitted TOEFL iBT 105-114. Any test should be taken no later than 2026-11-25 because reportable scores can take two weeks. Transcripts must be uploaded before submission and fall grades are not required. The statement should be a concise one- or two-page essay describing research interests, related experiences, and objectives.
  - url: https://admissions.scs.cmu.edu/portal/apply_gr
    retrieved_at: '2026-08-24'
    use: Application portal, Fall 2027 opening date, deadlines, and fees
    notes: Official SCS application portal. Opens 2026-09-09 for Fall 2027 admission. Early deadline 2026-11-18 at 3 p.m. EST with an $80 fee per program; final deadline 2026-12-09 at 3 p.m. EST with a $100 fee per program.
