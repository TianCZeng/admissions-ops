research:
  - id: research-graduation-project
    title: "Vision-Based Localization Methods for Mobile Robots"
    original_title: "基于视觉的移动机器人定位方法研究"
    role: "undergraduate graduation project author"
    dates: "2025-2026"
    status: "submitted"
    methods:
      - "visual odometry"
      - "multi-view geometry"
      - "pose graph optimization"
      - "Python"
      - "C++"
    summary: "Compared feature-based and direct visual odometry front ends on an indoor mobile robot and reported trajectory drift, tracking losses, and recovery behaviour across corridor, lobby, and laboratory sequences."
    notes: "Undergraduate graduation project, submitted 2026-05 and defended 2026-06. The English title is a user-committed translation of the transcript title."
  - id: research-loop-closure-robustness
    title: "Loop-Closure Robustness for Visual SLAM in Repetitive Indoor Corridors"
    role: "research assistant"
    dates: "2026-2027"
    status: "in_progress"
    methods:
      - "visual simultaneous localization and mapping"
      - "place recognition"
      - "false-positive loop-closure analysis"
      - "PyTorch"
      - "ROS 2"
    summary: "Studies why appearance-based loop closure fails in corridors whose visual structure repeats, and measures how often false positives corrupt the pose graph relative to descriptor choice and geometric verification thresholds."
  - id: research-depth-calibration
    title: "Uncertainty Calibration for Monocular Depth Estimation"
    role: "course research project author"
    dates: "2025"
    status: "completed"
    methods:
      - "monocular depth estimation"
      - "uncertainty calibration"
      - "reliability diagrams"
      - "NumPy"
    summary: "Measured how poorly a monocular depth network's predicted confidence matched its actual error on indoor scenes, and reported calibration curves before and after temperature scaling."

projects:
  - id: project-slam-evaluation-harness
    title: "Indoor Visual SLAM Evaluation Harness"
    dates: "2026"
    summary: "Built a reproducible harness that replays recorded robot sequences through several SLAM front ends and reports absolute trajectory error, relative pose error, and tracking-loss counts with per-sequence breakdowns."
    tools:
      - "Python"
      - "C++"
      - "ROS 2"
      - "Open3D"
  - id: project-camera-imu-calibration
    title: "Camera-IMU Calibration Toolkit for a Differential-Drive Robot"
    dates: "2025"
    summary: "Implemented and documented a calibration workflow for a camera and inertial unit on a laboratory robot, including target capture guidance, residual plots, and a re-calibration check after hardware changes."
    tools:
      - "Python"
      - "OpenCV"
      - "Kalibr"
      - "MATLAB"
  - id: project-warehouse-robot
    title: "Autonomous Warehouse Robot for the University Robotics Competition"
    dates: "2024"
    summary: "Led the perception subsystem of a four-person team robot that located and retrieved marked packages, contributing marker detection, pose estimation, and a fallback behaviour for detection dropouts."
    tools:
      - "C++"
      - "ROS"
      - "OpenCV"
      - "Gazebo"

