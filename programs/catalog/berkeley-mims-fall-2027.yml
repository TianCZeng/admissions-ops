document_instructions:
  text: MIMS applicants must submit a current resume, a statement of purpose, a personal history statement, a short answer essay, two professional letters of recommendation, transcripts, TOEFL or IELTS scores if English proficiency is required, and a programming proficiency form. GRE and GMAT are no longer required.
