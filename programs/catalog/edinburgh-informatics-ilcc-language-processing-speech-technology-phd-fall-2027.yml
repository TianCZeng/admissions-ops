document_instructions:
  text: As part of the online application, applicants must provide a personal statement, relevant knowledge or training skills, the name of a proposed supervisor, a CV, a research proposal of three to five pages unless a specific project gives different guidelines, degree certificates and official transcripts for all completed and in-progress degrees, and contact details for two academic references. There is no application fee.
